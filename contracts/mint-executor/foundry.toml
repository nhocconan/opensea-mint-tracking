[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
# Fail closed on anything the compiler flags, not just errors — this
# contract holds real ETH and gates real mint calls (ADR 0004 Executor
# fallback); a warning here is worth treating as a build failure.
deny = "warnings"

[fuzz]
runs = 512

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
