name: hoodmint-integration

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hoodmint
      POSTGRES_PASSWORD: hoodmint
      POSTGRES_DB: hoodmint
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoodmint -d hoodmint"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "${VALKEY_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
